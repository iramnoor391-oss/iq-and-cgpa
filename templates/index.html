<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLP Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result { margin-top: 20px; padding: 10px; background-color: #e2f0d9; border-left: 5px solid #388e3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Predictor (SLP)</h2>
    <form action="#" method="POST">
        <div class="form-group">
            <label for="iq">IQ Level:</label>
            <input type="number" id="iq" name="iq" step="0.1" required placeholder="e.g. 115">
        </div>
        <div class="form-group">
            <label for="cgpa">CGPA:</label>
            <input type="number" id="cgpa" name="cgpa" step="0.01" min="0" max="10" required placeholder="e.g. 8.5">
        </div>
        <button type="submit">Predict</button>
    </form>
    
        <div class="result">
            {{ prediction }} 
        </div>
</div>
</body>
</html>
